<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Alvin AI Voice Assistant interface</title>
  <desc id="desc">Futuristic voice assistant dashboard with waveform and neural network visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#130b24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff0040"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="150" r="260" fill="#00d4ff" opacity="0.08"/>
  <circle cx="220" cy="760" r="300" fill="#ff0040" opacity="0.08"/>
  <g opacity="0.18" fill="none" stroke="#00d4ff" stroke-width="2">
    <path d="M180 690 C390 560 470 760 690 610 S1060 500 1410 260"/>
    <path d="M160 280 C430 380 620 180 870 330 S1230 610 1450 480"/>
    <circle cx="180" cy="690" r="12" fill="#00d4ff"/>
    <circle cx="690" cy="610" r="16" fill="#ff0040"/>
    <circle cx="870" cy="330" r="12" fill="#00d4ff"/>
    <circle cx="1410" cy="260" r="14" fill="#00d4ff"/>
    <circle cx="1450" cy="480" r="12" fill="#ff0040"/>
  </g>
  <g opacity="0.9">
    <rect x="130" y="145" width="520" height="610" rx="30" fill="#0b1226" fill-opacity="0.78" stroke="#00d4ff" stroke-opacity="0.35"/>
    <rect x="950" y="145" width="520" height="250" rx="30" fill="#0b1226" fill-opacity="0.78" stroke="#00d4ff" stroke-opacity="0.3"/>
    <rect x="950" y="430" width="520" height="325" rx="30" fill="#0b1226" fill-opacity="0.78" stroke="#ff0040" stroke-opacity="0.3"/>
    <circle cx="390" cy="390" r="120" fill="none" stroke="url(#cyan)" stroke-width="16" filter="url(#glow)"/>
    <circle cx="390" cy="390" r="76" fill="#0a1024" fill-opacity="0.9" stroke="#00d4ff" stroke-opacity="0.7"/>
    <g fill="url(#cyan)" filter="url(#glow)">
      <rect x="292" y="350" width="18" height="80" rx="9"/>
      <rect x="320" y="315" width="18" height="150" rx="9"/>
      <rect x="348" y="275" width="18" height="230" rx="9"/>
      <rect x="376" y="230" width="18" height="320" rx="9"/>
      <rect x="404" y="250" width="18" height="280" rx="9"/>
      <rect x="432" y="300" width="18" height="180" rx="9"/>
      <rect x="460" y="345" width="18" height="90" rx="9"/>
    </g>
    <g fill="#00d4ff" opacity="0.75">
      <rect x="1010" y="205" width="180" height="16" rx="8"/>
      <rect x="1010" y="245" width="320" height="16" rx="8" opacity="0.55"/>
      <rect x="1010" y="285" width="250" height="16" rx="8" opacity="0.35"/>
    </g>
    <g fill="#ff0040" opacity="0.8">
      <rect x="1010" y="500" width="120" height="120" rx="18"/>
      <rect x="1160" y="500" width="120" height="120" rx="18" opacity="0.65"/>
      <rect x="1310" y="500" width="120" height="120" rx="18" opacity="0.45"/>
    </g>
    <path d="M1010 700 H1410" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
