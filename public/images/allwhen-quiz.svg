<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AllWhenQuiz real-time classroom assessment dashboard</title>
  <desc id="desc">Futuristic real-time quiz interface with question panels, live score bars, and result charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#130b24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff0040"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="180" r="280" fill="#00d4ff" opacity="0.08"/>
  <circle cx="230" cy="730" r="270" fill="#ff0040" opacity="0.08"/>
  <g opacity="0.17" fill="none" stroke="#00d4ff" stroke-width="2">
    <path d="M120 700 C350 560 480 760 700 610 S1080 510 1480 270"/>
    <path d="M120 300 C410 410 620 210 860 360 S1240 620 1480 480"/>
  </g>
  <g opacity="0.92">
    <rect x="110" y="130" width="820" height="650" rx="30" fill="#0b1226" fill-opacity="0.8" stroke="#00d4ff" stroke-opacity="0.35"/>
    <rect x="970" y="130" width="520" height="300" rx="30" fill="#0b1226" fill-opacity="0.8" stroke="#00d4ff" stroke-opacity="0.28"/>
    <rect x="970" y="470" width="520" height="310" rx="30" fill="#0b1226" fill-opacity="0.8" stroke="#ff0040" stroke-opacity="0.3"/>
    <circle cx="520" cy="430" r="165" fill="none" stroke="url(#cyan)" stroke-width="22" filter="url(#glow)"/>
    <circle cx="520" cy="430" r="105" fill="#0a1024" fill-opacity="0.92" stroke="#00d4ff" stroke-opacity="0.65"/>
    <g fill="url(#cyan)" filter="url(#glow)">
      <rect x="390" y="390" width="24" height="80" rx="12"/>
      <rect x="430" y="350" width="24" height="160" rx="12"/>
      <rect x="470" y="300" width="24" height="260" rx="12"/>
      <rect x="510" y="250" width="24" height="360" rx="12"/>
      <rect x="550" y="285" width="24" height="290" rx="12"/>
      <rect x="590" y="340" width="24" height="200" rx="12"/>
      <rect x="630" y="385" width="24" height="90" rx="12"/>
    </g>
    <g fill="#00d4ff" opacity="0.78">
      <rect x="1040" y="190" width="180" height="22" rx="11"/>
      <rect x="1040" y="240" width="310" height="22" rx="11" opacity="0.55"/>
      <rect x="1040" y="290" width="240" height="22" rx="11" opacity="0.35"/>
    </g>
    <g fill="#ff0040" opacity="0.8">
      <rect x="1040" y="540" width="180" height="150" rx="22"/>
      <rect x="1260" y="540" width="180" height="150" rx="22" opacity="0.65"/>
    </g>
    <g fill="#00d4ff" opacity="0.75">
      <rect x="1040" y="735" width="100" height="40" rx="20"/>
      <rect x="1180" y="735" width="100" height="40" rx="20" opacity="0.55"/>
      <rect x="1320" y="735" width="100" height="40" rx="20" opacity="0.4"/>
    </g>
    <path d="M1040 610 H1360" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
